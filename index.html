<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
<title>İnadına TV | XTREAM PLAYER</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root {
    --bg-main: #0B0B0E;
    --bg-card: #141519;
    --bg-hover: #1E1F26;
    --accent-color: #E50914; /* İnadına Kırmızı */
    --accent-hover: #B8070F;
    --text-light: #F5F5F1;
    --text-muted: #8C92A0;
    --border-color: #262833;
    --radius: 12px;
    --transition: all 0.3s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background-color: var(--bg-main);
    font-family: 'Poppins', sans-serif;
    color: var(--text-light);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 1200px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* Header Start */
.header {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-text {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text-light);
}

.logo-text span {
    color: var(--accent-color);
}

.header-actions {
    display: flex;
    gap: 10px;
}

.btn-primary {
    background-color: var(--accent-color);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: var(--transition);
}

.btn-primary:hover {
    background-color: var(--accent-hover);
}
/* Header End */

/* Panel Selector Start */
.panel-selector {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 5px;
    scrollbar-width: thin;
    scrollbar-color: var(--accent-color) var(--bg-card);
}

.panel-selector::-webkit-scrollbar {
    height: 6px;
}
.panel-selector::-webkit-scrollbar-thumb {
    background-color: var(--accent-color);
    border-radius: 10px;
}

.panel-btn {
    flex: 0 0 auto;
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    padding: 12px 25px;
    border-radius: 8px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
}

.panel-btn:hover {
    border-color: var(--accent-color);
    color: var(--text-light);
}

.panel-btn.active {
    background-color: var(--accent-color);
    border-color: var(--accent-color);
    color: #fff;
}
/* Panel Selector End */

/* Main Content Area */
.main-content {
    display: grid;
    grid-template-columns: 350px 1fr;
    gap: 20px;
    height: 600px;
}

@media (max-width: 900px) {
    .main-content {
        grid-template-columns: 1fr;
        height: auto;
    }
}

/* Sidebar / Browser */
.browser-section {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
}

.tabs {
    display: flex;
    background-color: #0F1015;
    border-bottom: 1px solid var(--border-color);
}

.tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-muted);
    padding: 15px 0;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: var(--transition);
    border-bottom: 3px solid transparent;
}

.tab-btn:hover {
    color: var(--text-light);
}

.tab-btn.active {
    color: var(--accent-color);
    border-bottom-color: var(--accent-color);
}

.browser-header {
    background-color: var(--bg-hover);
    padding: 10px 15px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 1px solid var(--border-color);
    display: none;
}

.browser-header:hover {
    color: var(--text-light);
}

.list-container {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}

.list-container::-webkit-scrollbar {
    width: 6px;
}
.list-container::-webkit-scrollbar-thumb {
    background-color: var(--border-color);
    border-radius: 10px;
}

.list-item {
    padding: 12px 15px;
    background-color: transparent;
    border-radius: 6px;
    margin-bottom: 5px;
    font-size: 0.85rem;
    color: var(--text-muted);
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.list-item:hover {
    background-color: var(--bg-hover);
    color: var(--text-light);
}

.item-cat {
    font-weight: 600;
    color: var(--text-light);
    border-left: 3px solid var(--accent-color);
}

.badge-locked {
    background-color: rgba(229, 9, 20, 0.15);
    color: var(--accent-color);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 700;
}

.badge-open {
    background-color: rgba(46, 204, 113, 0.15);
    color: #2ecc71;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 700;
}

/* Player Area */
.player-section {
    background-color: #000;
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    height: 100%;
    min-height: 400px;
}

.video-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.player-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: rgba(20, 21, 25, 0.85);
    padding: 15px 30px;
    border-radius: 8px;
    font-weight: 600;
    color: var(--text-light);
    pointer-events: none;
    border: 1px solid var(--border-color);
}

.player-footer {
    background-color: var(--bg-card);
    padding: 15px;
    text-align: center;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-muted);
    border-top: 1px solid var(--border-color);
}

/* Modals */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: rgba(0, 0, 0, 0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    backdrop-filter: blur(5px);
}

.modal-box {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    padding: 30px;
    border-radius: var(--radius);
    width: 90%;
    max-width: 400px;
    text-align: center;
}

.modal-box h3 {
    margin-bottom: 10px;
    color: var(--text-light);
}

.modal-box p {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 20px;
}

.modal-box input {
    width: 100%;
    background-color: var(--bg-main);
    border: 1px solid var(--border-color);
    color: var(--text-light);
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 15px;
    outline: none;
    font-family: inherit;
    text-align: center;
}

.modal-box input:focus {
    border-color: var(--accent-color);
}

.modal-box button {
    width: 100%;
    margin-bottom: 10px;
}

.btn-secondary {
    background-color: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border-color);
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
}

.btn-secondary:hover {
    background-color: var(--bg-hover);
    color: var(--text-light);
}

.error-text {
    color: var(--accent-color);
    font-size: 0.8rem;
    margin-top: 5px;
}

/* Toast */
.toast-msg {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background-color: var(--bg-hover);
    color: var(--text-light);
    padding: 12px 25px;
    border-radius: 8px;
    border-left: 4px solid var(--accent-color);
    font-weight: 500;
    font-size: 0.9rem;
    z-index: 9999;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.5s forwards;
}

@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

@keyframes fadeOut {
    to { transform: translateY(-20px); opacity: 0; visibility: hidden; }
}

/* Helpers */
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <header class="header">
        <div class="logo-area">
            <div class="logo-text">İnadına<span>TV</span></div>
        </div>
        <div class="header-actions">
            <button id="changePasswordBtn" class="btn-secondary">🔞 Şifre Değiştir</button>
        </div>
    </header>

    <!-- Panels List -->
    <div class="panel-selector" id="panelSelector">
        <div style="color:var(--text-muted); padding:10px;">⏳ Paneller yükleniyor...</div>
    </div>

    <!-- Main Application Area -->
    <main class="main-content">
        
        <!-- Channels / VOD / Series Browser -->
        <aside class="browser-section" id="channelListView">
            <div class="tabs">
                <button class="tab-btn active" data-type="live">Canlı TV</button>
                <button class="tab-btn" data-type="vod">Filmler</button>
                <button class="tab-btn" data-type="series">Diziler</button>
            </div>
            <div class="browser-header" id="browserBack">
                ⟵ Geri Dön
            </div>
            <div class="list-container" id="browserList">
                <div style="padding:20px; text-align:center; color:var(--text-muted);">
                    Lütfen yukarıdan bir panel seçin.
                </div>
            </div>
        </aside>

        <!-- Video Player -->
        <section class="player-section" id="playerView">
            <div class="video-container">
                <div id="videoOverlay" class="player-overlay">YAYIN BEKLENİYOR</div>
                <video id="videoPlayer" controls crossorigin="anonymous" playsinline></video>
            </div>
            <div class="player-footer" id="epgDisplay">
                Lütfen listeden bir içerik seçin
            </div>
        </section>

    </main>
</div>

<!-- Password Modal (+18) -->
<div id="passwordModal" class="modal-overlay">
    <div class="modal-box" id="modalContent">
        <!-- Content injected dynamically -->
    </div>
</div>

<script>
// ==================== AYARLAR ====================
// GitHub RAW dosyanızın URL'sini buraya yapıştırın.
// Format örneği için bu dosyanın açıklamasına bakın.
const PANELS_JSON_URL = "https://raw.githubusercontent.com/KULLANICI_ADI/REPO_ADI/main/panels.json";

const ADULT_KEYWORDS = ["+18", "18+", "adult", "porno", "seks", "yetiskin", "erotik", "mature", "xxx", "nsfw"];
const USER_PASSWORD_KEY = "inadina_user_password";

let panels = {};
let currentPanel = null;
let browser = null;

// ==================== YARDIMCI FONKSİYONLAR ====================
function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'toast-msg';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function escapeHtml(str) { 
    if (!str) return ''; 
    return str.replace(/[&<>]/g, m => m==='&'?'&':m==='<'?'<':'>'); 
}

// ==================== PANEL YÜKLEME (GITHUB JSON) ====================
async function loadPanelsFromGithub() {
    try {
        const response = await fetch(PANELS_JSON_URL, { cache: "no-store" });
        if (!response.ok) throw new Error("Dosya çekilemedi (HTTP " + response.status + ")");
        
        const data = await response.json();
        panels = {};
        
        // Gelen JSON verisinin dizi(array) olduğunu varsayıyoruz
        if (Array.isArray(data)) {
            data.forEach(p => { panels[p.id] = p; });
        } else {
            throw new Error("JSON formatı hatalı (Dizi bekleniyor)");
        }

        renderPanelButtons();

        // Otomatik olarak ilk paneli seç
        const firstPanel = Object.values(panels)[0];
        if (firstPanel) {
            switchPanel(firstPanel.id);
        } else {
            document.getElementById('browserList').innerHTML = '<div style="padding:20px;text-align:center;">📭 Yüklenen dosyada panel bulunamadı.</div>';
        }
    } catch (error) {
        console.error("Panel yükleme hatası:", error);
        document.getElementById('panelSelector').innerHTML = `<div style="color:var(--accent-color); padding:10px;">❌ Bağlantı Hatası. Paneller yüklenemedi. Lütfen JSON URL'sini kontrol edin.</div>`;
        document.getElementById('browserList').innerHTML = '';
        showToast("Sunucuyla iletişim kurulamadı!");
    }
}

function renderPanelButtons() {
    const container = document.getElementById('panelSelector');
    container.innerHTML = '';
    const panelList = Object.values(panels);
    
    if (panelList.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted); padding:10px;">Panel listesi boş.</div>';
        return;
    }

    panelList.forEach(panel => {
        const btn = document.createElement('button');
        btn.className = `panel-btn ${currentPanel === panel.id ? 'active' : ''}`;
        btn.textContent = panel.name;
        btn.onclick = () => switchPanel(panel.id);
        container.appendChild(btn);
    });
}

async function switchPanel(panelId) {
    if (!panels[panelId]) return;
    currentPanel = panelId;
    renderPanelButtons();
    
    const panel = panels[panelId];
    // Xtream API URL yapısı oluşturulur
    browser.config = { 
        api: `${panel.host}/player_api.php?username=${panel.user}&password=${panel.pass}`, 
        host: panel.host, 
        user: panel.user, 
        pass: panel.pass 
    };
    
    // Geçerli sekmeyi baştan yükle
    const activeTab = document.querySelector('.tab-btn.active');
    const type = activeTab ? activeTab.dataset.type : 'live';
    browser.loadType(type);
    showToast(`Bağlandı: ${panel.name}`);
}

// ==================== +18 ŞİFRE YÖNETİMİ ====================
function isUserPasswordSet() { return localStorage.getItem(USER_PASSWORD_KEY) !== null; }
function getUserPassword() { return localStorage.getItem(USER_PASSWORD_KEY); }
function setUserPassword(pwd) { localStorage.setItem(USER_PASSWORD_KEY, pwd); }
function clearUserPassword() { localStorage.removeItem(USER_PASSWORD_KEY); }
function verifyUserPassword(inputPwd) { return inputPwd === getUserPassword(); }

function showSetupUserPasswordModal(onSuccess) {
    const modal = document.getElementById('passwordModal');
    const content = document.getElementById('modalContent');
    content.innerHTML = `
        <h3>🔐 +18 ŞİFRE BELİRLEYİN</h3>
        <p>Yetişkin içeriklere erişim için bir şifre oluşturun.</p>
        <input type="password" id="modalPwd" placeholder="Şifre belirleyin">
        <input type="password" id="modalPwdConfirm" placeholder="Şifreyi tekrar girin">
        <button id="submitPwdBtn" class="btn-primary">Kaydet ve Devam Et</button>
        <div id="modalError" class="error-text"></div>
    `;
    modal.style.display = 'flex';
    
    document.getElementById('submitPwdBtn').onclick = () => {
        const p1 = document.getElementById('modalPwd').value.trim();
        const p2 = document.getElementById('modalPwdConfirm').value.trim();
        const err = document.getElementById('modalError');
        
        if (p1.length < 3) { err.innerText = 'En az 3 karakter girin!'; return; }
        if (p1 !== p2) { err.innerText = 'Şifreler uyuşmuyor!'; return; }
        
        setUserPassword(p1);
        modal.style.display = 'none';
        showToast("Şifre başarıyla oluşturuldu.");
        if (onSuccess) onSuccess();
    };
}

function showUserPasswordModal(callback, title = "🔞 +18 İÇERİK", message = "Bu içeriğe erişmek için şifrenizi girin.") {
    const modal = document.getElementById('passwordModal');
    const content = document.getElementById('modalContent');
    content.innerHTML = `
        <h3>${title}</h3>
        <p>${message}</p>
        <input type="password" id="modalPwd" placeholder="Şifreniz">
        <button id="submitPwdBtn" class="btn-primary">İçeriği Aç</button>
        <button id="forgotPwdBtn" class="btn-secondary">Şifremi Unuttum</button>
        <div id="modalError" class="error-text"></div>
    `;
    modal.style.display = 'flex';
    
    const input = document.getElementById('modalPwd');
    document.getElementById('submitPwdBtn').onclick = () => {
        if (verifyUserPassword(input.value.trim())) {
            modal.style.display = 'none';
            if (callback) callback(true);
        } else {
            document.getElementById('modalError').innerText = 'Hatalı şifre!';
            input.value = '';
        }
    };
    
    document.getElementById('forgotPwdBtn').onclick = () => {
        modal.style.display = 'none';
        clearUserPassword();
        showSetupUserPasswordModal(() => {
            const activeTab = document.querySelector('.tab-btn.active');
            if (activeTab && browser && browser.config) browser.loadType(activeTab.dataset.type);
            if (callback) callback(false);
        });
    };
}

function showChangeUserPasswordModal() {
    if (!isUserPasswordSet()) { showSetupUserPasswordModal(); return; }
    const modal = document.getElementById('passwordModal');
    const content = document.getElementById('modalContent');
    content.innerHTML = `
        <h3>🔐 ŞİFRE DEĞİŞTİR</h3>
        <p>Devam etmek için mevcut şifrenizi girin.</p>
        <input type="password" id="oldPwd" placeholder="Mevcut Şifre">
        <button id="verifyOldBtn" class="btn-primary">İleri</button>
        <button id="cancelBtn" class="btn-secondary">İptal</button>
        <div id="modalError" class="error-text"></div>
    `;
    modal.style.display = 'flex';
    
    document.getElementById('cancelBtn').onclick = () => modal.style.display = 'none';
    document.getElementById('verifyOldBtn').onclick = () => {
        const old = document.getElementById('oldPwd').value.trim();
        if (verifyUserPassword(old)) {
            content.innerHTML = `
                <h3>🔐 YENİ ŞİFRE</h3>
                <input type="password" id="newPwd" placeholder="Yeni Şifre">
                <input type="password" id="newPwdConfirm" placeholder="Tekrar Yeni Şifre">
                <button id="saveNewBtn" class="btn-primary">Kaydet</button>
                <button id="cancelBtn2" class="btn-secondary">İptal</button>
                <div id="modalError2" class="error-text"></div>
            `;
            document.getElementById('cancelBtn2').onclick = () => modal.style.display = 'none';
            document.getElementById('saveNewBtn').onclick = () => {
                const n1 = document.getElementById('newPwd').value.trim();
                const n2 = document.getElementById('newPwdConfirm').value.trim();
                const err2 = document.getElementById('modalError2');
                if(n1.length < 3) { err2.innerText = 'En az 3 karakter!'; return; }
                if(n1 !== n2) { err2.innerText = 'Şifreler uyuşmuyor!'; return; }
                setUserPassword(n1);
                modal.style.display = 'none';
                showToast("Şifre başarıyla değiştirildi.");
            };
        } else {
            document.getElementById('modalError').innerText = 'Hatalı şifre!';
        }
    };
}

function isAdultContent(text) { 
    if (!text) return false; 
    return ADULT_KEYWORDS.some(kw => text.toLowerCase().includes(kw.toLowerCase())); 
}

// ==================== IPTV BROWSER ALTYAPISI ====================
class IPTVBrowser {
    constructor() { this.config = null; }
    
    async fetchSafe(url) { 
        try { 
            const r = await fetch(url); 
            if (!r.ok) throw new Error(); 
            return await r.json(); 
        } catch(e) { 
            const proxy = `https://corsproxy.io/?${encodeURIComponent(url)}`; 
            const r = await fetch(proxy); 
            if (!r.ok) throw new Error(); 
            return await r.json(); 
        } 
    }

    async loadType(type) {
        if (!this.config) return;
        
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.tab-btn[data-type="${type}"]`).classList.add('active');
        
        const list = document.getElementById('browserList'); 
        list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">Kategoriler yükleniyor...</div>'; 
        document.getElementById('browserBack').style.display = 'none';
        
        let action = type === 'live' ? 'get_live_categories' : (type === 'vod' ? 'get_vod_categories' : 'get_series_categories');
        
        try {
            const data = await this.fetchSafe(`${this.config.api}&action=${action}`);
            list.innerHTML = '';
            if (!data || !data.length) { 
                list.innerHTML = '<div style="padding:20px;text-align:center;">Kategori bulunamadı.</div>'; 
                return; 
            }
            
            data.forEach(cat => {
                const catName = cat.category_name || "İsimsiz";
                const isAdult = isAdultContent(catName);
                const el = document.createElement('div');
                el.className = 'list-item item-cat';
                el.innerHTML = `<span>${escapeHtml(catName)}</span><span class="${isAdult ? 'badge-locked' : 'badge-open'}">${isAdult ? '🔞 Şifreli' : 'Açık'}</span>`;
                el.onclick = () => this.handleCategoryClick(type, cat.category_id, catName);
                list.appendChild(el);
            });
        } catch(e) { 
            list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--accent-color);">Sunucu Yanıt Vermedi.</div>`; 
        }
    }

    handleCategoryClick(type, catId, catName) {
        const fetchStreams = () => this.loadStreams(type, catId);
        if (isAdultContent(catName)) {
            if (!isUserPasswordSet()) { showSetupUserPasswordModal(fetchStreams); return; }
            showUserPasswordModal((success) => { 
                if (success) fetchStreams(); 
            }, "🔞 KİLİTLİ KATEGORİ", `"${catName}" için şifre girin.`);
        } else { 
            fetchStreams(); 
        }
    }

    async loadStreams(type, catId) {
        const list = document.getElementById('browserList'); 
        list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">İçerikler taranıyor...</div>';
        
        const backBtn = document.getElementById('browserBack'); 
        backBtn.style.display = 'block';
        
        const activeType = document.querySelector('.tab-btn.active').dataset.type;
        backBtn.onclick = () => this.loadType(activeType);
        
        let action = type === 'live' ? 'get_live_streams' : (type === 'vod' ? 'get_vod_streams' : 'get_series');
        
        try {
            const data = await this.fetchSafe(`${this.config.api}&action=${action}&category_id=${catId}`);
            list.innerHTML = '';
            
            if (!data || !data.length) {
                list.innerHTML = '<div style="padding:20px;text-align:center;">Bu kategoride içerik yok.</div>';
                return;
            }

            data.forEach(item => {
                const name = item.name || item.title || "İsimsiz";
                const id = item.stream_id || item.series_id;
                let ext = (item.container_extension || "mp4").replace(/^\./, '');
                
                const el = document.createElement('div'); 
                el.className = 'list-item'; 
                el.textContent = name;
                el.onclick = () => this.play(type, id, ext, name);
                list.appendChild(el);
            });
        } catch(e) { 
            list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--accent-color);">İçerik yüklenemedi.</div>`; 
        }
    }

    async play(type, id, ext, name) {
        const vid = document.getElementById('videoPlayer'); 
        const overlay = document.getElementById('videoOverlay');
        
        overlay.style.display = 'block'; 
        overlay.textContent = 'BAĞLANTI KURULUYOR...'; 
        vid.style.display = 'none';
        
        if (vid._hls) { vid._hls.destroy(); vid._hls = null; }
        
        const playStream = (url, streamName) => {
            document.getElementById('epgDisplay').textContent = streamName || name;
            overlay.style.display = 'none'; 
            vid.style.display = 'block';
            
            if (window.Hls && Hls.isSupported()) { 
                const hls = new Hls(); 
                vid._hls = hls; 
                hls.loadSource(url); 
                hls.attachMedia(vid); 
                hls.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(e=>console.log(e))); 
            } else { 
                vid.src = url; 
                vid.play().catch(e=>console.log(e)); 
            }
        };

        const checkAdult = (streamName, streamUrl) => {
            if (isAdultContent(streamName)) {
                if (!isUserPasswordSet()) { 
                    showSetupUserPasswordModal(() => playStream(streamUrl, streamName)); return; 
                }
                showUserPasswordModal((success) => { 
                    if (success) playStream(streamUrl, streamName); 
                    else overlay.textContent = "KİLİTLİ YAYIN"; 
                }, "🔞 KİLİTLİ İÇERİK", "İzlemek için şifre girin.");
            } else { 
                playStream(streamUrl, streamName); 
            }
        };

        if (type === 'series') {
            overlay.textContent = "Bölüm yükleniyor...";
            try {
                const info = await this.fetchSafe(`${this.config.api}&action=get_series_info&series_id=${id}`);
                let episodes = [];
                if (info?.episodes) {
                    if (Array.isArray(info.episodes)) episodes = info.episodes;
                    else { const seasons = Object.keys(info.episodes); if (seasons.length) episodes = info.episodes[seasons[0]] || []; }
                }
                if (episodes.length) {
                    const ep = episodes[0];
                    const url = `${this.config.host}/series/${this.config.user}/${this.config.pass}/${ep.id}.${(ep.container_extension || "mp4").replace(/^\./, '')}`;
                    const epName = `${name} - S${ep.season} B${ep.episode_num}`;
                    checkAdult(epName, url);
                } else throw new Error("Bölüm yok");
            } catch(e) { overlay.textContent = "HATA: Dizi yüklenemedi"; }
            return;
        }

        const url = type === 'live' 
            ? `${this.config.host}/live/${this.config.user}/${this.config.pass}/${id}.m3u8` 
            : `${this.config.host}/movie/${this.config.user}/${this.config.pass}/${id}.${ext}`;
            
        checkAdult(name, url);
    }
}

    // Uygulama açılışında Şifre belirlenmemişse ayarla
    if (!isUserPasswordSet()) { 
        setTimeout(() => showSetupUserPasswordModal(), 500); 
    }

    // Event Dinleyicileri
    document.getElementById('changePasswordBtn')?.addEventListener('click', () => showChangeUserPasswordModal());
    document.querySelectorAll('.tab-btn').forEach(btn => { 
        btn.addEventListener('click', () => { 
            if(browser.config) browser.loadType(btn.dataset.type); 
        }); 
    });

    // GitHub'dan panelleri yükle
    await loadPanelsFromGithub();
});
